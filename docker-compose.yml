version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tracker-v7-postgres
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker_password
      POSTGRES_DB: tracker_v7
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tracker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tracker-v7-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tracker-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracker-v7-backend
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: tracker
      DB_PASSWORD: tracker_password
      DB_NAME: tracker_v7
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your_jwt_secret_key_change_this
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    networks:
      - tracker-network
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: tracker-v7-frontend
    ports:
      - "3001:3000"
    environment:
      REACT_APP_API_URL: http://localhost:3000/api
      REACT_APP_WEBSOCKET_URL: ws://localhost:3000
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
    networks:
      - tracker-network
    command: npm start

volumes:
  postgres_data:
  redis_data:

networks:
  tracker-network:
    driver: bridge
